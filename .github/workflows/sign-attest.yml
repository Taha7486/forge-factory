name: sign-attest

# Signs an image that a build workflow (build-push or build-juice-shop) already put in ECR, and attaches a CycloneDX SBOM and a
# vulnerability scan as signed attestations. Keyless: the signature is tied to this
# workflow file on main through GitHub's OIDC token. The Kyverno policies in forge-gitops
# (policies/) pin exactly this file name and branch as the signer, so do not rename it
# and run it from main only.
# Between the scan and the signing, a vulnerability gate (gate/) blocks CRITICAL and HIGH
# findings that have no unexpired waiver.
# Ported from the R1 spike workflow (r1-sign-golden.yml): same tool versions, same
# attestation types, signing pinned to Rekor v1 (ADR-001); ECR login instead of GHCR and
# Docker Hub.
# Two ways in. Automatic: when build-push or build-juice-shop finishes successfully on main,
# this workflow signs that commit's image (workflow_run; always signed, SBOM and scan
# attested; skipped if the digest already carries our signature). Manual: workflow_dispatch
# with the inputs below, for experiments such as attestations only.
on:
  workflow_run:
    workflows: [build-push, build-juice-shop]
    types: [completed]
  workflow_dispatch:
    inputs:
      repository:
        description: ECR repository of the image to sign
        type: choice
        options:
          - forge/podinfo
          - forge/juice-shop
        default: forge/podinfo
      tag:
        description: Tag in that repository to sign; empty means this commit's SHA
        type: string
        default: ''
      sign:
        description: Run cosign sign (false = attestations only)
        type: boolean
        default: true
      sbom:
        description: Attest the SBOM (false = no SBOM attestation)
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-3

# One run per image at a time: the tag-schema fallback index is read-modify-write, and two
# runs on the same image would race the already-signed check below.
concurrency:
  group: >-
    sign-attest-${{ github.event.workflow_run.name == 'build-juice-shop' && 'forge/juice-shop'
    || github.event.workflow_run.name == 'build-push' && 'forge/podinfo'
    || inputs.repository }}-${{ github.event.workflow_run.head_sha || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  sign-attest:
    # workflow_run fires for every outcome of the build workflows: continue only for a
    # success on main of this repository. Skipped until the AWS_ROLE_ARN variable exists
    # (the build workflows skip themselves in the same case).
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        vars.AWS_ROLE_ARN != ''
      )
    runs-on: ubuntu-latest
    steps:
      # A workflow_run job checks out the head of main, not the commit that was built, so
      # the tag comes from the triggering run here and never from github.sha.
      - name: Work out what to sign
        id: params
        env:
          EVENT: ${{ github.event_name }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_REPOSITORY: ${{ inputs.repository }}
          IN_TAG: ${{ inputs.tag }}
          IN_SIGN: ${{ inputs.sign }}
          IN_SBOM: ${{ inputs.sbom }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ]; then
            case "$RUN_NAME" in
              build-push) REPOSITORY=forge/podinfo ;;
              build-juice-shop) REPOSITORY=forge/juice-shop ;;
              *) echo "::error::Unexpected triggering workflow: $RUN_NAME"; exit 1 ;;
            esac
            TAG="$RUN_SHA"
            SIGN=true
            SBOM=true
          else
            REPOSITORY="${IN_REPOSITORY:-forge/podinfo}"
            TAG="${IN_TAG:-$GITHUB_SHA}"
            SIGN="$IN_SIGN"
            SBOM="$IN_SBOM"
          fi
          {
            echo "repository=$REPOSITORY"
            echo "tag=$TAG"
            echo "sign=$SIGN"
            echo "sbom=$SBOM"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install Syft and Trivy (pinned, SHA-256 verified)
        run: |
          set -euo pipefail
          curl -sSfLO https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
          echo "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3  syft_1.51.1_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf syft_1.51.1_linux_amd64.tar.gz syft
          curl -sSfLO https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  trivy_0.74.0_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf trivy_0.74.0_Linux-64bit.tar.gz trivy
          sudo install syft trivy /usr/local/bin/
          syft version
          trivy --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Writes the Docker credentials that cosign, Syft and Trivy all read.
      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Everything below works on the digest, never on the tag.
      - name: Find the image digest
        id: image
        env:
          ECR_REPOSITORY: ${{ steps.params.outputs.repository }}
          TAG: ${{ steps.params.outputs.tag }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'images[0].imageId.imageDigest' --output text)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::No image tagged $TAG in $ECR_REPOSITORY. Run the build workflow for this repository first."
            exit 1
          fi
          echo "ref=$REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "tag: $TAG"
          echo "digest: $DIGEST"

      # Automatic runs only. A second signature on the same digest adds a duplicate bundle and
      # another Rekor entry, so stop if ours is already there. Only "exit 0" counts as signed
      # and only cosign's "no signatures found" counts as unsigned: any other failure (network,
      # a signature by another identity) fails the job instead of guessing.
      - name: Skip if already signed
        id: existing
        if: github.event_name == 'workflow_run'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          set -uo pipefail
          if OUT=$(cosign verify \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/sign-attest.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$REF" 2>&1); then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Already signed by this workflow; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q "no signatures found" <<<"$OUT"; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::cosign verify failed in a way that does not mean unsigned:"
            echo "$OUT"
            exit 1
          fi

      - name: Make the SBOM and the vulnerability scan
        if: steps.existing.outputs.signed != 'true'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          syft "$REF" -o cyclonedx-json=sbom.cdx.json
          trivy image --format cosign-vuln --output vuln.json "$REF"

      # Fails the job, so nothing below runs and the image stays unsigned, if a CRITICAL or
      # HIGH finding has no valid waiver. Rules and exit codes: gate/vuln_gate.py. Waivers:
      # gate/waivers.json. It reads the same vuln.json that is attested, so waived findings
      # stay visible in the attestation. No date override here: the script refuses --today
      # on a runner.
      - name: Vulnerability gate
        if: steps.existing.outputs.signed != 'true'
        run: python3 -I gate/vuln_gate.py --vuln vuln.json --waivers gate/waivers.json --summary "$GITHUB_STEP_SUMMARY"

      # Sequential on purpose (the tag-schema fallback index is read-modify-write).
      # --signing-config pins signing to Rekor v1 only (ADR-001).
      - name: Sign and attest
        if: steps.existing.outputs.signed != 'true'
        env:
          REF: ${{ steps.image.outputs.ref }}
          DO_SIGN: ${{ steps.params.outputs.sign }}
          DO_SBOM: ${{ steps.params.outputs.sbom }}
        run: |
          set -euo pipefail
          SC=(--signing-config signing-config/rekor-v1-only.json)
          if [ "$DO_SIGN" = "true" ]; then
            cosign sign --yes "${SC[@]}" "$REF"
          fi
          if [ "$DO_SBOM" = "true" ]; then
            cosign attest --yes "${SC[@]}" --type cyclonedx --predicate sbom.cdx.json "$REF"
          fi
          cosign attest --yes "${SC[@]}" --type vuln --predicate vuln.json "$REF"

      - name: Summary
        if: steps.existing.outputs.signed != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          DO_SIGN: ${{ steps.params.outputs.sign }}
          DO_SBOM: ${{ steps.params.outputs.sbom }}
        run: |
          {
            echo "## Signed and attested"
            echo "Digest: \`$DIGEST\`"
            echo "- Signed: $DO_SIGN. SBOM attested: $DO_SBOM. Vulnerability scan attested: true."
            echo "- SBOM components: $(jq '.components | length' sbom.cdx.json)"
            echo "- scanFinishedOn: $(jq -r '.metadata.scanFinishedOn' vuln.json)"
            echo "- Vulnerabilities by severity:"
            jq -r '[.scanner.result.Results[]?.Vulnerabilities[]?.Severity] | group_by(.) | map("  - \(.[0]): \(length)") | .[]' vuln.json
          } >> "$GITHUB_STEP_SUMMARY"
